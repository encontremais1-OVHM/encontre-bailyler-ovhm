name: Baileys service CI

on:
  push:
    paths:
      - "baileys-service/**"
      - ".github/workflows/baileys-service.yml"
  pull_request:
    paths:
      - "baileys-service/**"
      - ".github/workflows/baileys-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baileys-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
